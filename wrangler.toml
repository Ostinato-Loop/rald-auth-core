name = "rald-auth"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = []

[vars]
ENVIRONMENT  = "production"
SUPABASE_URL = "https://onxdcikfttdmnhofsuwo.supabase.co"

# Secrets — set via: wrangler secret put <NAME>
# Required (NONE have fallbacks):
#   SUPABASE_SERVICE_ROLE_KEY  RALD_JWT_SECRET  TERMII_API_KEY
#   TERMII_SENDER_ID  RESEND_API_KEY  CLERK_SECRET_KEY  CLERK_PUBLISHABLE_KEY
# Phase 1 additions (optional — enables health alerting and rotation alerts):
#   OPEN_OBSERVE_API_KEY    OPEN_OBSERVE_ENDPOINT
#   MACHINE_IDENTITY_SECRET  ADMIN_USER_ID

[[routes]]
pattern = "auth.rald.cloud/*"
zone_name = "rald.cloud"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b0e3c620619c4aab85e5f59f6ebddc0e"

[[kv_namespaces]]
binding = "RALD_SESSION_KV"
id = "15ee70c2a0534880a11843469d0468ef"

[build]
command = ""

[observability]
enabled = true
head_sampling_rate = 1

# ── Scheduled Jobs ────────────────────────────────────────────────────────────
# Crons registered manually via CF Dashboard → Workers & Pages → rald-auth → Triggers
# (wrangler deploy requires 'Scheduled Tasks:Edit' scope to manage crons via CI)
# Active: "0 * * * *" (hourly cleanup), "0 0 * * *" (daily cleanup)
