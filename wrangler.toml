name = "rald-auth"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = []

[vars]
ENVIRONMENT      = "production"
SUPABASE_URL     = "https://onxdcikfttdmnhofsuwo.supabase.co"
EVENTS_BUS_URL   = "https://events.rald.cloud"

# Secrets — set via: wrangler secret put <NAME>
# Required (NONE have fallbacks):
#   SUPABASE_SERVICE_ROLE_KEY  RALD_JWT_SECRET  TERMII_API_KEY
#   TERMII_SENDER_ID  RESEND_API_KEY  CLERK_SECRET_KEY  CLERK_PUBLISHABLE_KEY
# Phase 1 additions (event bus + machine identity):
#   RALD_INTERNAL_SECRET   — shared secret for X-RALD-Internal-Key event emission
#   MACHINE_KEY_ID         — provisioned via POST /machine/auth
#   MACHINE_KEY_SECRET     — provisioned during machine identity onboarding
# Optional observability:
#   OPEN_OBSERVE_API_KEY   OPEN_OBSERVE_ENDPOINT
#   ADMIN_USER_ID

[[routes]]
pattern = "auth.rald.cloud/*"
zone_name = "rald.cloud"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b0e3c620619c4aab85e5f59f6ebddc0e"

[[kv_namespaces]]
binding = "RALD_SESSION_KV"
id = "15ee70c2a0534880a11843469d0468ef"

[build]
command = ""

[observability]
enabled = true
head_sampling_rate = 1

# ── Scheduled Jobs ────────────────────────────────────────────────────────────
# "0 * * * *"  — every hour: OTP cleanup + expired sessions + retry queue drain
# "0 0 * * *"  — midnight UTC daily: device cleanup + rotation alerts + health snapshot
[triggers]
crons = ["0 * * * *", "0 0 * * *"]
