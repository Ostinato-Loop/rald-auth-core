name = "rald-auth"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = []

[vars]
ENVIRONMENT  = "production"
SUPABASE_URL = "https://onxdcikfttdmnhofsuwo.supabase.co"

# Secrets — set via: wrangler secret put <NAME>
# Required (NONE have fallbacks):
#   SUPABASE_SERVICE_ROLE_KEY  RALD_JWT_SECRET  TERMII_API_KEY
#   TERMII_SENDER_ID  RESEND_API_KEY  CLERK_SECRET_KEY  CLERK_PUBLISHABLE_KEY

[[routes]]
pattern = "auth.rald.cloud/*"
zone_name = "rald.cloud"

# ── KV Namespaces ─────────────────────────────────────────────────────────────
# Create: wrangler kv namespace create rald-auth-rate-limit
# Then replace the id string with the actual namespace ID.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_NAMESPACE_ID"

# Create: wrangler kv namespace create rald-session
# Then replace the id string with the actual namespace ID.
[[kv_namespaces]]
binding = "RALD_SESSION_KV"
id = "REPLACE_WITH_RALD_SESSION_KV_NAMESPACE_ID"

[build]
command = ""

[observability]
enabled = true
head_sampling_rate = 1
