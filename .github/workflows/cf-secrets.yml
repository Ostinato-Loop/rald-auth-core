name: CF Secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rald-auth-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Push CF secrets for rald-auth
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install

      - name: Push SUPABASE_SERVICE_ROLE_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name rald-auth && echo "SUPABASE_SERVICE_ROLE_KEY ✓" || echo "WARN: not set"

      - name: Push RALD_JWT_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put RALD_JWT_SECRET --name rald-auth && echo "RALD_JWT_SECRET ✓" || echo "WARN: not set"

      - name: Push TERMII_API_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.TERMII_API_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put TERMII_API_KEY --name rald-auth && echo "TERMII_API_KEY ✓" || echo "WARN: not set"

      - name: Push TERMII_SENDER_ID
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.TERMII_SENDER_ID }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put TERMII_SENDER_ID --name rald-auth && echo "TERMII_SENDER_ID ✓" || echo "WARN: not set"

      - name: Push RESEND_API_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.RESEND_API_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put RESEND_API_KEY --name rald-auth && echo "RESEND_API_KEY ✓" || echo "WARN: not set"

      - name: Push MACHINE_KEY_ID
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.MACHINE_KEY_ID }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put MACHINE_KEY_ID --name rald-auth && echo "MACHINE_KEY_ID ✓" || echo "WARN: not set"

      - name: Push MACHINE_KEY_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.MACHINE_KEY_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put MACHINE_KEY_SECRET --name rald-auth && echo "MACHINE_KEY_SECRET ✓" || echo "WARN: not set"

      - name: Push CLERK_SECRET_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put CLERK_SECRET_KEY --name rald-auth && echo "CLERK_SECRET_KEY ✓" || echo "WARN: not set"

      - name: Push CLERK_PUBLISHABLE_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put CLERK_PUBLISHABLE_KEY --name rald-auth && echo "CLERK_PUBLISHABLE_KEY ✓" || echo "WARN: not set"

      - name: Audit log
        if: always()
        run: echo "AUDIT: service=rald-auth secrets-push commit=${{ github.sha }} actor=${{ github.actor }} ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }}"
