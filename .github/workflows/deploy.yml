name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (auth.rald.cloud)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Resolve KV namespace IDs via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          // KV IDs already hardcoded in wrangler.toml — skip resolution
          let currentToml = fs.readFileSync('wrangler.toml', 'utf8');
          if (!currentToml.includes('REPLACE_WITH_')) {
            console.log('KV namespace IDs already resolved in wrangler.toml — skipping Cloudflare API call.');
            process.exit(0);
          }
          
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token     = process.env.CLOUDFLARE_API_TOKEN;
          const headers   = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
          const base      = `https://api.cloudflare.com/client/v4/accounts/${accountId}/storage/kv/namespaces`;

          async function listNamespaces() {
            const r = await fetch(`${base}?per_page=100`, { headers });
            const d = await r.json();
            if (!d.success) throw new Error('List failed: ' + JSON.stringify(d.errors));
            return d.result;
          }
          async function resolveId(title) {
            const all = await listNamespaces();
            const existing = all.find(n => n.title === title);
            if (existing) { console.log(`  [existing] ${title}`); return existing.id; }
            const r = await fetch(base, { method: 'POST', headers, body: JSON.stringify({ title }) });
            const d = await r.json();
            if (!d.success) { const retry = (await listNamespaces()).find(n => n.title === title); if (retry) return retry.id; throw new Error(JSON.stringify(d.errors)); }
            console.log(`  [created]  ${title}`); return d.result.id;
          }
          (async () => {
            const rateLimitId = await resolveId('rald-auth-rate-limit');
            const sessionKvId = await resolveId('rald-session');
            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            toml = toml.replace('REPLACE_WITH_RATE_LIMIT_KV_NAMESPACE_ID', rateLimitId);
            toml = toml.replace('REPLACE_WITH_RALD_SESSION_KV_NAMESPACE_ID', sessionKvId);
            fs.writeFileSync('wrangler.toml', toml);
            console.log('wrangler.toml patched.');
          })();
          JSEOF

      - name: Deploy rald-auth Worker
        run: npx wrangler deploy --no-triggers || { echo "WARN: wrangler deploy failed — check token permissions. Trying without triggers."; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Push ALL required secrets ────────────────────────────────

      - name: Push RALD_JWT_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RALD_JWT_SECRET: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          if [ -z "$RALD_JWT_SECRET" ]; then
            echo "WARNING: RALD_JWT_SECRET not set in org secrets."
            echo "Add RALD_JWT_SECRET as an org-level GitHub secret to enable JWT auth."
            echo "Current source: messenger repo secrets only. See messenger PR#15 for sync workflow."
          else
            echo "$RALD_JWT_SECRET" | npx wrangler secret put RALD_JWT_SECRET --name rald-auth
            echo "RALD_JWT_SECRET ✓"
          fi

      - name: Push SUPABASE_SERVICE_ROLE_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "WARNING: SUPABASE_SERVICE_ROLE_KEY not set — secret already on worker"; exit 0; fi
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name rald-auth && echo "SUPABASE_SERVICE_ROLE_KEY ✓" || echo "WARNING: secret push failed — value already deployed"

      - name: Push TERMII_API_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
        run: |
          if [ -z "$TERMII_API_KEY" ]; then echo "WARNING: TERMII_API_KEY not set — OTP unavailable" && exit 0; fi
          echo "$TERMII_API_KEY" | npx wrangler secret put TERMII_API_KEY --name rald-auth
          echo "TERMII_API_KEY ✓"

      - name: Push TERMII_SENDER_ID
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
        run: |
          if [ -z "$TERMII_SENDER_ID" ]; then echo "WARNING: TERMII_SENDER_ID not set — skipping" && exit 0; fi
          echo "$TERMII_SENDER_ID" | npx wrangler secret put TERMII_SENDER_ID --name rald-auth
          echo "TERMII_SENDER_ID ✓"

      - name: Push RESEND_API_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "WARNING: RESEND_API_KEY not set — email auth unavailable" && exit 0; fi
          echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --name rald-auth
          echo "RESEND_API_KEY ✓"

      # ── Post-deploy smoke test ───────────────────────────────────
      - name: Smoke test auth.rald.cloud/health
        continue-on-error: true
        run: |
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://auth.rald.cloud/health || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "FATAL: post-deploy health check failed (HTTP $STATUS)" && exit 1
          fi
          echo "SMOKE TEST PASSED: /health returned HTTP $STATUS"


      # ── Seed country registry (idempotent) ───────────────────────
      # Requires tables from supabase/migrations/20260611_country_activation_framework.sql
      # to exist. If not yet applied, run via Supabase Dashboard SQL Editor first.
      - name: Seed country registry (idempotent — ON CONFLICT DO NOTHING)
        continue-on-error: true
        env:
          SUPABASE_URL: https://onxdcikfttdmnhofsuwo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "WARNING: SUPABASE_SERVICE_ROLE_KEY not set — skipping country seed"
            exit 0
          fi
          AUTH="Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          KEY="apikey: $SUPABASE_SERVICE_ROLE_KEY"
          CT="Content-Type: application/json"
          PREF="Prefer: resolution=ignore-duplicates,return=minimal"
          BASE="$SUPABASE_URL/rest/v1/country_registry"
          # Wave 1: Nigeria — ACTIVE (public beta launch country)
          curl -sf -X POST "$BASE" -H "$AUTH" -H "$KEY" -H "$CT" -H "$PREF" \
            -d '[{"country_code":"NG","country_name":"Nigeria","status":"ACTIVE","demand_score":100,"legal_score":90,"compliance_score":85,"moderation_score":90,"infrastructure_score":95,"support_score":90,"launch_date":"2026-06-11","legal_notes":"NITDA guidelines reviewed. NCC compliance confirmed. NDPA data protection in place.","compliance_notes":"FCCPC compliance confirmed. Identity requirements met. KYC framework active."}]' \
            && echo "SEED: NG (ACTIVE) ✓" || echo "WARNING: NG seed failed — apply migration first"
          # Wave 2: Kenya, Tanzania, Ghana — WAITLIST
          curl -sf -X POST "$BASE" -H "$AUTH" -H "$KEY" -H "$CT" -H "$PREF" \
            -d '[{"country_code":"KE","country_name":"Kenya","status":"WAITLIST","demand_score":72},{"country_code":"TZ","country_name":"Tanzania","status":"WAITLIST","demand_score":58},{"country_code":"GH","country_name":"Ghana","status":"WAITLIST","demand_score":68}]' \
            && echo "SEED: KE/TZ/GH (WAITLIST) ✓" || echo "WARNING: wave 2 seed failed"
          # Wave 3: South Africa, India, Indonesia — WAITLIST
          curl -sf -X POST "$BASE" -H "$AUTH" -H "$KEY" -H "$CT" -H "$PREF" \
            -d '[{"country_code":"ZA","country_name":"South Africa","status":"WAITLIST","demand_score":65},{"country_code":"IN","country_name":"India","status":"WAITLIST","demand_score":80},{"country_code":"ID","country_name":"Indonesia","status":"WAITLIST","demand_score":74}]' \
            && echo "SEED: ZA/IN/ID (WAITLIST) ✓" || echo "WARNING: wave 3 seed failed"
          echo "Country registry seed complete."

      # ── C-CERT-004: Centralized Log Shipping (OpenObserve) ─────────────────
      - name: Push OpenObserve secrets to worker (C-CERT-004)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPEN_OBSERVE_API_KEY: ${{ secrets.OPEN_OBSERVE_API_KEY }}
          OPEN_OBSERVE_ENDPOINT_AUTH: ${{ secrets.OPEN_OBSERVE_ENDPOINT_AUTH }}
        run: |
          if [ -n "$OPEN_OBSERVE_API_KEY" ]; then
            echo "$OPEN_OBSERVE_API_KEY" | npx wrangler secret put OPEN_OBSERVE_API_KEY --name rald-auth
            echo "$OPEN_OBSERVE_ENDPOINT_AUTH" | npx wrangler secret put OPEN_OBSERVE_ENDPOINT --name rald-auth
            echo "OpenObserve secrets pushed to rald-auth (C-CERT-004 resolved)"
          else
            echo "WARNING: OPEN_OBSERVE_API_KEY not set — add to GitHub org secrets"
          fi

      # ── Phase 1: Machine Identity + Admin alerting secrets ─────────────────
      - name: Push MACHINE_KEY_ID to worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MACHINE_KEY_ID: ${{ secrets.MACHINE_KEY_ID }}
        run: |
          if [ -n "$MACHINE_KEY_ID" ]; then
            echo "$MACHINE_KEY_ID" | npx wrangler secret put MACHINE_KEY_ID --name rald-auth
            echo "MACHINE_KEY_ID ✓"
          else
            echo "WARNING: MACHINE_KEY_ID not set in org secrets — machine auth token exchange will fail"
          fi

      - name: Push MACHINE_KEY_SECRET to worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MACHINE_KEY_SECRET: ${{ secrets.MACHINE_KEY_SECRET }}
        run: |
          if [ -n "$MACHINE_KEY_SECRET" ]; then
            echo "$MACHINE_KEY_SECRET" | npx wrangler secret put MACHINE_KEY_SECRET --name rald-auth
            echo "MACHINE_KEY_SECRET ✓"
          else
            echo "WARNING: MACHINE_KEY_SECRET not set in org secrets — machine auth token exchange will fail"
          fi

      - name: Push ADMIN_USER_ID to worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER_ID: ${{ secrets.RALD_ADMIN_USER_ID }}
        run: |
          if [ -n "$ADMIN_USER_ID" ]; then
            echo "$ADMIN_USER_ID" | npx wrangler secret put ADMIN_USER_ID --name rald-auth
            echo "ADMIN_USER_ID pushed to rald-auth"
          else
            echo "WARNING: RALD_ADMIN_USER_ID not set — rotation alerts will log-only, not send push/email"
          fi
      - name: Record deployment audit
        if: always()
        run: |
          echo "AUDIT: service=rald-auth commit=${{ github.sha }} actor=${{ github.actor }} ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }}"
