name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Resolve KV namespace IDs via Cloudflare API
        # Uses the CF REST API directly — no wrangler CLI flags needed.
        # Creates each namespace if it does not yet exist, then patches wrangler.toml.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token     = process.env.CLOUDFLARE_API_TOKEN;
          const headers   = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
          const base      = `https://api.cloudflare.com/client/v4/accounts/${accountId}/storage/kv/namespaces`;

          async function listNamespaces() {
            const r = await fetch(`${base}?per_page=100`, { headers });
            const d = await r.json();
            if (!d.success) throw new Error('List failed: ' + JSON.stringify(d.errors));
            return d.result;
          }

          async function createNamespace(title) {
            const r = await fetch(base, {
              method: 'POST', headers,
              body: JSON.stringify({ title }),
            });
            const d = await r.json();
            if (!d.success) {
              // Already exists with that title? Find it.
              if (d.errors?.some(e => e.code === 10014)) {
                const all = await listNamespaces();
                const existing = all.find(n => n.title === title);
                if (existing) return existing.id;
              }
              throw new Error('Create failed: ' + JSON.stringify(d.errors));
            }
            return d.result.id;
          }

          async function resolveId(title) {
            const all = await listNamespaces();
            const existing = all.find(n => n.title === title);
            if (existing) {
              console.log(`  [existing] ${title} → ${existing.id.slice(0,8)}...`);
              return existing.id;
            }
            const id = await createNamespace(title);
            console.log(`  [created]  ${title} → ${id.slice(0,8)}...`);
            return id;
          }

          (async () => {
            console.log('Resolving KV namespace IDs...');
            const rateLimitId  = await resolveId('rald-auth-rate-limit');
            const sessionKvId  = await resolveId('rald-session');

            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            toml = toml.replace('REPLACE_WITH_RATE_LIMIT_KV_NAMESPACE_ID',  rateLimitId);
            toml = toml.replace('REPLACE_WITH_RALD_SESSION_KV_NAMESPACE_ID', sessionKvId);
            fs.writeFileSync('wrangler.toml', toml);
            console.log('wrangler.toml patched with real KV namespace IDs.');
          })();
          JSEOF

      - name: Deploy rald-auth Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
