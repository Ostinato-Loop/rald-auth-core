name: Deploy — rald-auth-core › CF Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rald-auth-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve KV namespace IDs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          const h = { 'Authorization': `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces`;
          async function listAll() { const r = await fetch(`${base}?per_page=100`, { headers: h }); const d = await r.json(); if (!d.success) throw new Error(JSON.stringify(d.errors)); return d.result; }
          async function resolveId(title) {
            const all = await listAll(); const existing = all.find(n => n.title === title);
            if (existing) { console.log(`  [existing] ${title}`); return existing.id; }
            const r = await fetch(base, { method: 'POST', headers: h, body: JSON.stringify({ title }) }); const d = await r.json();
            if (!d.success) { const retry = (await listAll()).find(n => n.title === title); if (retry) return retry.id; throw new Error(JSON.stringify(d.errors)); }
            console.log(`  [created]  ${title}`); return d.result.id;
          }
          (async () => {
            const rateLimitId = await resolveId('rald-auth-rate-limit');
            const sessionKvId = await resolveId('rald-session');
            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            toml = toml.replace('REPLACE_WITH_RATE_LIMIT_KV_NAMESPACE_ID', rateLimitId);
            toml = toml.replace('REPLACE_WITH_RALD_SESSION_KV_NAMESPACE_ID', sessionKvId);
            fs.writeFileSync('wrangler.toml', toml);
            console.log('wrangler.toml patched.');
          })().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push SUPABASE_SERVICE_ROLE_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name rald-auth && echo "SUPABASE_SERVICE_ROLE_KEY ✓" || echo "WARN: SUPABASE_SERVICE_ROLE_KEY not set"

      - name: Push RALD_JWT_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put RALD_JWT_SECRET --name rald-auth && echo "RALD_JWT_SECRET ✓" || echo "WARN: RALD_JWT_SECRET not set"

      - name: Push TERMII_API_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.TERMII_API_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put TERMII_API_KEY --name rald-auth && echo "TERMII_API_KEY ✓" || echo "WARN: TERMII_API_KEY not set"

      - name: Push TERMII_SENDER_ID
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.TERMII_SENDER_ID }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put TERMII_SENDER_ID --name rald-auth && echo "TERMII_SENDER_ID ✓" || echo "WARN: TERMII_SENDER_ID not set"

      - name: Push RESEND_API_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.RESEND_API_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put RESEND_API_KEY --name rald-auth && echo "RESEND_API_KEY ✓" || echo "WARN: RESEND_API_KEY not set"

      - name: Push MACHINE_KEY_ID
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.MACHINE_KEY_ID }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put MACHINE_KEY_ID --name rald-auth && echo "MACHINE_KEY_ID ✓" || echo "WARN: MACHINE_KEY_ID not set"

      - name: Push MACHINE_KEY_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.MACHINE_KEY_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put MACHINE_KEY_SECRET --name rald-auth && echo "MACHINE_KEY_SECRET ✓" || echo "WARN: MACHINE_KEY_SECRET not set"

      - name: Push CLERK_SECRET_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put CLERK_SECRET_KEY --name rald-auth && echo "CLERK_SECRET_KEY ✓" || echo "WARN: CLERK_SECRET_KEY not set"

      - name: Push CLERK_PUBLISHABLE_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put CLERK_PUBLISHABLE_KEY --name rald-auth && echo "CLERK_PUBLISHABLE_KEY ✓" || echo "WARN: CLERK_PUBLISHABLE_KEY not set"

      - name: Smoke test
        continue-on-error: true
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://auth.rald.cloud/health)
          echo "auth.rald.cloud/health HTTP $STATUS"
          [ "$STATUS" = "200" ] || echo "WARNING: expected 200, got $STATUS"

      - name: Audit log
        if: always()
        run: echo "AUDIT: service=rald-auth commit=${{ github.sha }} actor=${{ github.actor }} ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }}"
